  <g transform="translate(450 330)">
    
    <path d="M -110 -50 Q -130 0 -120 90 L -90 130 L -110 220 Q -130 280 -100 280 L 110 280 Q 140 280 120 220 L 100 130 L 130 90 Q 140 0 120 -50 Q 80 -90 0 -90 Q -80 -90 -110 -50 Z" fill="#1A1815" opacity="0.92"></path>
    
