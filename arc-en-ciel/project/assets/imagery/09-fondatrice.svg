    <path d="M -60 95 Q 0 130 60 95 L 70 140 Q 0 165 -70 140 Z" fill="#0A0A0A" opacity="0.85"></path>
    
    <path d="M -130 150 Q -100 250 -80 380 L -40 380 Q -60 250 -90 150 Z" fill="#9C7E5C" opacity="0.35"></path>
  </g>
  
  
